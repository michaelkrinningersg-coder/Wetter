name: Deutschlandwerte sammeln

# Der DWD veröffentlicht die Tageswerte nur als ein ZIP je Station — rund 2900
# Archive für beide Netze. Eine Sammeldatei gibt es nicht, und die Archive
# halten nur etwa 500 Tage vor. Wer eine dauerhafte Reihe will, muss sie selbst
# festhalten; dieser Lauf holt den Vortag und legt ihn als CSV ins Repository.

on:
  schedule:
    # 10:00 UTC. Der DWD aktualisiert die recent-Archive gegen 09:00 UTC; eine
    # Stunde Abstand deckt Verzögerungen ab, ohne den Tag zu verschenken.
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      datum:
        description: 'Zieltag (JJJJ-MM-TT), leer = Vortag'
        required: false
        type: string
      backfill:
        description: 'Alle verfügbaren Tage zurückfüllen (~500)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deutschland
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Kein npm ci: das Skript nutzt ausschließlich die Node-Standard-
      # bibliothek, die ZIP-Archive werden über node:zlib entpackt. Damit
      # entfällt der native Build von better-sqlite3 und der Lauf kann nicht
      # an einer Abhängigkeit scheitern.
      - name: Messwerte abrufen
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            node scripts/fetch-germany.js --backfill
          else
            node scripts/fetch-germany.js ${{ inputs.datum }}
          fi

      - name: Änderungen committen
        run: |
          if [ -z "$(git status --porcelain data/germany)" ]; then
            echo "Keine neuen Tage — nichts zu committen."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/germany

          # Neue Tage samt Stationszahl in die Commit-Nachricht, damit der
          # Verlauf im Log ohne Diff lesbar ist.
          summary=$(git diff --cached --name-only --diff-filter=A -- 'data/germany/*/*.csv' \
            | sort | while read -r f; do
                printf '%s: %s Stationen\n' "$(basename "$f" .csv)" "$(($(wc -l < "$f") - 1))"
              done)
          [ -n "$summary" ] || summary="Stationsregister aktualisiert"

          git commit -m "Deutschlandwerte $(date -u '+%Y-%m-%d %H:%M UTC')" -m "$summary"

          # Zwischen Abruf und Push kann der Pegel-Workflow committet haben.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), rebase und erneut…"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done

          echo "Push nach fünf Versuchen fehlgeschlagen."
          exit 1
