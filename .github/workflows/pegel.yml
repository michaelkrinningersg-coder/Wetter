name: Pegelstände sammeln

# Die Quellen halten nur wenige Tage vor: PEGELONLINE rollierend 30 Tage, das
# NLWKN-Portal gar keine Zeitreihe. Wer eine Historie will, muss sie selbst
# aufbauen — dieser Lauf holt die aktuellen Werte und schreibt sie als CSV ins
# Repository.
#
# Stündlich, weil ein Tageswert für Leine und Rhume nur einen einzigen Punkt
# ergibt und ein Hochwasserverlauf damit unsichtbar bliebe.

on:
  schedule:
    # Zur vollen Stunde (UTC). GitHub führt geplante Läufe „best effort" aus;
    # unter Last können sie sich verschieben oder ausfallen. Für eine Messreihe
    # ist das unkritisch, weil jeder Lauf unabhängig ist.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Zwei gleichzeitige Läufe würden beim Commit kollidieren.
concurrency:
  group: pegel
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Kein npm ci: das Skript nutzt ausschließlich die Node-Standardbibliothek.
      # Damit entfällt der native Build von better-sqlite3, der Lauf dauert
      # Sekunden statt Minuten und kann nicht an einer Abhängigkeit scheitern.
      - name: Pegelwerte abrufen
        run: node scripts/fetch-gauges.js

      - name: Änderungen committen
        run: |
          if [ -z "$(git status --porcelain data/gauges)" ]; then
            echo "Keine neuen Messwerte — nichts zu committen."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gauges

          # Zeilenzahl je Pegel in die Commit-Nachricht, damit der Verlauf im
          # Log ohne Diff lesbar ist.
          summary=$(for f in data/gauges/*.csv; do
            printf '%s: %s Messwerte\n' "$(basename "$f" .csv)" "$(($(wc -l < "$f") - 1))"
          done)

          git commit -m "Pegelstände $(date -u '+%Y-%m-%d %H:%M UTC')" -m "$summary"

          # Zwischen Abruf und Push kann ein anderer Lauf committet haben.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $attempt), rebase und erneut…"
            git pull --rebase --autostash
            sleep $((attempt * 5))
          done

          echo "Push nach fünf Versuchen fehlgeschlagen."
          exit 1
