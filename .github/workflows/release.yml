name: Windows-Programm bauen

# Die App läuft lokal als Electron-Fenster. Gebaut wird sie hier, weil ein
# Windows-Programm einen Windows-Läufer braucht und `better-sqlite3` als
# nativer Baustein gegen die Electron-ABI übersetzt werden muss — das kann
# electron-builder nur auf der Zielplattform.
#
# Ohne Tag läuft der Bau auf Zuruf und legt das Ergebnis als Artefakt ab;
# mit einem Tag `v*` hängt er es zusätzlich an ein Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Portable .exe und Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Die Oberfläche zuerst: electron-builder packt nur `dist/`, nicht die
      # Quellen. Ohne diesen Schritt startet das Fenster in ein leeres Blatt.
      - name: Oberfläche bauen
        run: npm run build

      # Die Datenbank hier bauen statt auf jedem Rechner beim ersten Start.
      # Gemessen: 59,6 Sekunden und 938 MB Arbeitsspeicher — einmal auf dem
      # Läufer, oder einmal bei jedem, der das Programm installiert.
      - name: Datenbank aufbauen
        run: npm run build:db

      # Beides gepackt in `vorlage/`: 4.669 CSV-Dateien als ein .tar.gz (12 MB
      # statt 65) und die Datenbank als .gz (34 MB statt 157). Das Programm
      # entpackt sie beim ersten Start in 5,3 Sekunden.
      - name: Vorlagen packen
        run: npm run vorlage

      # Erzwungen, und deshalb ein eigener Schritt: electron-builder ruft
      # @electron/rebuild von sich aus auf, aber ohne `-f`. Da `npm ci` schon
      # eine gültig aussehende better_sqlite3.node abgelegt hat — die für Node
      # — lässt dieser Lauf sie stehen, und im Paket landet ABI 127 statt 130.
      # Das Fenster öffnete sich dann und blieb schwarz.
      - name: Nativen Baustein gegen die Electron-ABI übersetzen
        run: npx electron-rebuild -f -w better-sqlite3

      # `--publish never` auch beim Tag: das Release wird unten in einem
      # eigenen Schritt bestückt, damit ein fehlgeschlagener Upload nicht als
      # erfolgreicher Bau durchgeht.
      - name: Programm paketieren
        run: npx electron-builder --win --publish never

      - name: Umfang melden
        shell: bash
        run: |
          echo "### Gebaut" >> "$GITHUB_STEP_SUMMARY"
          for f in release/*.exe; do
            [ -e "$f" ] || continue
            size=$(du -m "$f" | cut -f1)
            echo "- \`$(basename "$f")\` — ${size} MB" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wetterstation-windows
          path: release/*.exe
          if-no-files-found: error

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
