name: GitHub Pages

# Pages liefert Dateien aus, keine Query-Strings. Dieser Lauf baut das Frontend
# im statischen Modus und schreibt zusätzlich jede API-Antwort als JSON-Datei —
# rund 6800 Dateien, gut 100 MB, deutlich unter dem 1-GB-Rahmen von Pages.
#
# Zwei Dinge kann eine statische Auslieferung nicht, und sie täuscht es auch
# nicht vor: den DWD-Import auf Knopfdruck und das Nachladen der Pegel beim
# Aufruf. Beide Schalter sind im statischen Modus ausgeblendet; die Daten sind
# so frisch wie der letzte Deploy.

on:
  # Nach jedem Datenlauf neu veröffentlichen, damit die Seite dem Archiv folgt.
  workflow_run:
    workflows: ['Deutschlandwerte sammeln', 'Pegelstände sammeln', 'Umweltdaten sammeln']
    types: [completed]
  push:
    branches: [claude/wetter-station-github-analysis-257mst]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein laufender Deploy darf nicht abgebrochen werden, sonst bleibt die Seite
# auf halbem Stand; ein wartender wird durch den neueren ersetzt.
concurrency:
  group: pages
  cancel-in-progress: false

# Job-Bezeichner dürfen nur ASCII enthalten; die Anzeigenamen stehen in `name`.
jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Der Lauf ist die einzige Stelle, an der Lint und Typprüfung
      # zwangsläufig ausgeführt werden. Beide sind schnell und beide brechen
      # den Deploy ab, bevor eine kaputte Fassung veröffentlicht wird.
      - name: Lint und Typen prüfen
        run: |
          npm run lint
          npm run typecheck

      # Die Datenbank liegt bewusst nicht im Repository. Die drei Stationsreihen
      # kommen direkt vom DWD (rund zehn Sekunden), Deutschlandarchiv und
      # Rekordbasis liest der Server beim Start aus den committeten CSV-Dateien.
      - name: Stationen importieren
        run: npm run import:stations

      # Nach dem Import, weil die Rauchtests das echte Archiv brauchen; die
      # Regressionstests legen sich ihre eigene, leere Datenbank an und sehen
      # es nie. Rot heißt: kein Deploy. Ein Rechenfehler soll die Seite nicht
      # erreichen, auch nicht mit frischen Messwerten im Rücken.
      - name: Tests
        run: npm test

      - name: Statisch bauen
        env:
          # Eine Pages-Seite liegt unter /<repo>/; ohne das Präfix zeigen alle
          # Asset- und JSON-Pfade ins Leere.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:static

      - name: Umfang melden
        run: |
          echo "Dateien: $(find dist -type f | wc -l)"
          echo "Größe:   $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
