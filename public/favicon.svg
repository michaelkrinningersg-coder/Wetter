<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The same sun-behind-cloud the header carries, redrawn for 16 px.

    Lucide's own CloudSun is a 24 px line icon at 2 px stroke; scaled into a
    favicon its rays collapse into mush. This keeps the motif but drops the
    detail that cannot survive: four rays instead of eight, and a solid cloud
    rather than an outlined one.

    Two fills, switched by the viewer's browser theme. A favicon sits on the
    tab strip, which follows the operating system rather than this app's own
    switch — so it answers to prefers-color-scheme, not to data-theme.
  -->
  <style>
    .sun { fill: #d9a441; }
    .cloud { fill: #4a5568; }
    @media (prefers-color-scheme: dark) {
      .sun { fill: #f0c060; }
      .cloud { fill: #cbd5e0; }
    }
  </style>

  <g class="sun">
    <circle cx="12" cy="11" r="4.4" />
    <rect x="11" y="1.5" width="2" height="3.4" rx="1" />
    <rect x="11" y="17.1" width="2" height="3.4" rx="1" />
    <rect x="1.5" y="10" width="3.4" height="2" rx="1" />
    <rect x="19.1" y="10" width="3.4" height="2" rx="1" />
    <rect x="4.4" y="3.4" width="2" height="3.4" rx="1" transform="rotate(-45 5.4 5.1)" />
    <rect x="17.6" y="3.4" width="2" height="3.4" rx="1" transform="rotate(45 18.6 5.1)" />
  </g>

  <path
    class="cloud"
    d="M13.4 30a5.4 5.4 0 0 1-.6-10.77 7 7 0 0 1 13.3 1.63A4.6 4.6 0 0 1 25.6 30z"
  />
</svg>
